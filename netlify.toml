[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[redirects]]
  from = "/"
  query = {page_id = "131"}
  to = "/resources.html"
  status = 301

[[redirects]]
  from = "/"
  query = {page_id = "3376"}
  to = "/resources.html"
  status = 301

[[redirects]]
  from = "/"
  query = {page_id = "3316"}
  to = "/support-workers.html"
  status = 301

[[redirects]]
  from = "/one-minute-feedback-forms/"
  to = "/support-workers.html"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
